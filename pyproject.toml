    {name = "matt",email = "matmigg0804@gmail.com"}
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "playwright (>=1.59.0,<2.0.0)",
    "anthropic (>=0.40.0,<1.0.0)",
